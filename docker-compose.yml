# 在 WSL2 中启动：cd /mnt/d/.../pm && docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: pm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: agile_pm
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - pm_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  pm_mysql_data:
